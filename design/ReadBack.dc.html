<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Literata:ital,wght@0,400;0,600;1,400&display=swap">
  <style>
    body { margin: 0; font-family: "Literata", Georgia, serif; color: #2b2418; }
    a { color: #b8541a; } a:hover { color: #92400e; }
    .display { font-family: "Baloo 2", "Avenir Next", system-ui, sans-serif; }
    .paper { background: radial-gradient(120% 80% at 50% -10%, #fff8ea 0%, #fbf6ea 45%, #f5ecd8 100%); }
    @keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
    .rise { animation: rise .7s cubic-bezier(.2,.8,.2,1) both; }
    .rise2 { animation: rise .7s .15s cubic-bezier(.2,.8,.2,1) both; }
    .rise3 { animation: rise .7s .3s cubic-bezier(.2,.8,.2,1) both; }
  </style>
</helmet>
<div class="paper" style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 20px 24px; display: flex; flex-direction: column; gap: 16px; background-color: #fbf6ea; overflow: hidden; position: relative;">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
  <div style="width: 44px; height: 44px; border-radius: 14px; background: #fffdf7; border: 2px solid #e7dcc4; display: grid; place-items: center; color: #2b2418;"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg></div>
  <div class="display" style="font-size: 20px; font-weight: 800; letter-spacing: .01em;">The Fox and the Crow</div>
  <div style="min-width: 44px; text-align: right; font-size: 13px; color: #6f6350; font-family: system-ui, sans-serif;">listen</div>
</div>
<div class="rise" style="text-align: center; margin-top: 28px; display: flex; flex-direction: column; align-items: center; gap: 10px;">
  <svg viewBox="0 0 120 120" width="96" height="96" fill="none" stroke="#2b2418" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="60" cy="68" rx="34" ry="26" fill="#5c5c6e"/><circle cx="82" cy="46" r="16" fill="#5c5c6e"/><circle cx="87" cy="43" r="3" fill="#fff"/><path d="M96 46 L112 50 L96 54 Z" fill="#f2c14e"/><path d="M30 60 C14 56 10 70 24 76" fill="#5c5c6e"/><path d="M50 94 L50 104 M70 94 L70 104"/></svg>
  <div style="font-family: system-ui, sans-serif; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #6f6350;">The end</div>
  <div style="font-size: 19px; font-style: italic; line-height: 1.45; max-width: 320px;">“Someone who praises you just to get something is not a friend.”</div>
</div>
<div class="rise2" style="text-align: center; font-family: system-ui, sans-serif; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #6f6350; margin-top: 10px;">Veer reads the whole line</div>
<div class="rise2" style="background: #fffdf7; border: 2px solid #e7dcc4; border-radius: 22px; padding: 22px 16px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
  <span class="display" style="font-size: 44px; font-weight: 800; background: #f3c7e6; color: #5c1447; padding: 2px 14px; border-radius: 14px;">it</span>
  <span class="display" style="font-size: 44px; font-weight: 800; background: #dbe7f7; color: #1e3a6b; padding: 2px 14px; border-radius: 14px;">i<u style="text-decoration: underline wavy #b8541a; text-underline-offset: 8px;">s</u></span>
  <span class="display" style="font-size: 44px; font-weight: 800; background: #f3c7e6; color: #5c1447; padding: 2px 14px; border-radius: 14px;">sad<span style="color:#2b2418;font-weight:600">.</span></span>
</div>
<div class="rise3" style="font-size: 15px; text-align: center; line-height: 1.4;"><b style="color: #b8541a;">Nani</b>: let them read the whole line first.<br><span style="color: #6f6350; font-size: 13px; font-family: system-ui, sans-serif;">pink = sound it out · blue = a tricky word Veer knows</span></div>
<div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
  <div class="display" style="height: 60px; border-radius: 16px; background: #e8e1d3; display: grid; place-items: center; font-size: 19px; font-weight: 800;">Needs help</div>
  <div class="display" style="height: 60px; border-radius: 16px; background: #cfe8c6; color: #1f4a17; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 19px; font-weight: 800;"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"/></svg> Read it</div>
</div>
</div></x-dc>
</body>
</html>
